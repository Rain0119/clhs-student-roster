[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clhs-student-roster"
version = "0.1.0"
description = "本機編班公告 PDF 四欄名單轉換與學號查詢工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pdfplumber==0.11.9"]

[project.scripts]
student-roster = "student_roster.cli:main"

[tool.setuptools.packages.find]
include = ["student_roster*"]

[tool.setuptools.package-data]
student_roster = ["data/*.json", "data/*.csv"]
